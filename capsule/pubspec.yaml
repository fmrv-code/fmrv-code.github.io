name: capsule
description: A privacy-first, offline notes and links manager.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Navigation ---
  go_router: ^14.2.0

  # --- Database (local, offline-first) ---
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- Markdown ---
  flutter_markdown: ^0.7.3+1

  # --- Link metadata fetching ---
  http: ^1.2.1

  # --- Persistence (theme preference) ---
  shared_preferences: ^2.2.3

  # --- Utilities ---
  url_launcher: ^6.3.0
  intl: ^0.19.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code generation ---
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
